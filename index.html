<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hayyu Language Interpreting</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f4f9;
      color: #333;
      margin: 0;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    h1 {
      color: #0056b3;
      margin-bottom: 5px;
    }
    .form-container {
      background: #ffffff;
      padding: 25px;
      border-radius: 8px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
      width: 100%;
      max-width: 450px;
      box-sizing: border-box;
    }
    label {
      font-weight: bold;
      display: block;
      margin-top: 15px;
      margin-bottom: 5px;
    }
    input {
      width: 100%;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 4px;
      box-sizing: border-box;
      font-size: 14px;
    }
    button {
      margin-top: 20px;
      width: 100%;
      padding: 12px;
      background-color: #0066cc;
      color: white;
      border: none;
      border-radius: 5px;
      font-size: 16px;
      cursor: pointer;
    }
    button:hover {
      background-color: #004999;
    }
  </style>
</head>
<body>

  <h1>Hayyu Language Interpreting 🌍</h1>
  <p>Welcome! How can we help you today?</p>
  <p>Please fill out the form below:</p>

  <div class="form-container">
    <!-- Formspree Integration -->
    <form action="https://formspree.io/f/YOUR_FORMSPREE_ID" method="POST">
      
      <label for="name">Enter Name:</label>
      <input type="text" id="name" name="Full Name" required placeholder="e.g. John Doe">

      <label for="email">Enter Email Address:</label>
      <input type="email" id="email" name="Email" required placeholder="name@example.com">

      <label for="nationality">Enter Nationality:</label>
      <input type="text" id="nationality" name="Nationality" required placeholder="e.g. Oromo">

      <label for="dob">Enter Date of Birth:</label>
      <input type="date" id="dob" name="Date of Birth" required>

      <label for="app_date">Enter Date of Application:</label>
      <input type="date" id="app_date" name="Date of Application" required>

      <label for="pref_date">Enter Preferred Date:</label>
      <input type="date" id="pref_date" name="Preferred Date" required>

      <button type="submit">Submit Info</button>

    </form>
  </div>

</body>
</html>
